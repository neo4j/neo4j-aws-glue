on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: "0 6 * * *"

jobs:
  build-dependency-tree:
    name: Build dependency trees
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      actions: 'read'
      checks: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 17
      - name: Build dependency tree
        run: ./mvnw dependency:tree -q -DoutputFile=maven_dep_tree.txt
      - name: Upload dependency tree file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-dependency-tree
          path: maven_dep_tree.txt

  semgrep-check:
    name: Run Semgrep scan
    runs-on: ubuntu-latest
    needs: build-dependency-tree
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    container:
      image: semgrep/semgrep:1.146.0
    permissions:
      contents: 'read'
      actions: 'read'
      checks: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - name: Download Maven dependency tree artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maven-dependency-tree
      - name: Semgrep scan
        run: |
          semgrep ci --no-git-ignore        
